# Third-party code is kept byte-for-byte; generated renv files are not ours either.
exclude: '^vendor/[^/]+/(upstream|renv)/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=51200"]
      - id: forbid-new-submodules
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: forbid-pdf
        name: forbid PDFs (papers are not committed)
        entry: PDFs must not be committed
        language: fail
        files: '(?i)\.pdf$'
      - id: check-citations
        name: check citation keys against thesis/references.bib
        entry: python scripts/check_citations.py
        language: python
        files: ^(thesis/|scripts/check_citations\.py$)
        pass_filenames: false

project:
  type: default
  output-dir: _output
  render:
    - tesina.qmd
  post-render:
    - _scripts/postrender.sh

lang: es-MX
number-sections: true
number-depth: 5

# Maintained by Marco with Zotero + Better BibTeX (auto-export). Do not edit by hand.
bibliography: references.bib
csl: apa.csl
link-citations: true

crossref:
  fig-title: Figura
  tbl-title: Tabla
  title-delim: "."

format:
  docx:
    reference-doc: templates/reference.docx
    toc: false
    fig-align: center


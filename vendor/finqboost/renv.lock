      "URL": "https://www.rcpp.org, https://dirk.eddelbuettel.com/code/rcpp.html, https://github.com/RcppCore/Rcpp",
      "License": "GPL (>= 2)",
      "BugReports": "https://github.com/RcppCore/Rcpp/issues",
      "MailingList": "rcpp-devel@lists.r-forge.r-project.org",

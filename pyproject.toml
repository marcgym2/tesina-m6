[project]
name = "tesina"
version = "0.1.0"
description = "Honest evaluation of probabilistic relative-return forecasts: M6 competition replication and extension (MCD thesis, FCFM UANL)."
readme = "README.md"
authors = [
    { name = "Marco Antonio Obregón Flores", email = "marcoobregonfl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
timesfm = [
    "timesfm[mlx]>=3.0.2",
]
verify = [
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "lxml>=6.1.3",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]

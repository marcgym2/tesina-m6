[project]
name = "tesina"
version = "0.1.0"
description = "Honest evaluation of probabilistic relative-return forecasts: M6 competition replication and extension (MCD thesis, FCFM UANL)."
readme = "README.md"
authors = [
    { name = "Marco Antonio Obregón Flores", email = "marcoobregonfl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]
